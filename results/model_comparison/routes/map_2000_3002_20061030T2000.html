  if (s.role === "origin") { fill = "#1a9641"; radius = 9; }
  if (s.role === "destination") { fill = "#000000"; radius = 9; }

     + `Routes drawn as straight lines between intersections.</span>`;

};

map.fitBounds(L.latLngBounds(pts).pad(0.15));
